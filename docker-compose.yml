services:
  # Service Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: immoplus_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Service MySQL
  db:
    image: mysql:8.4
    container_name: immoplus_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: immoplus
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Service Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immoplus_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: immoplus
      DB_USERNAME: root
      DB_PASSWORD: root123

# Volume pour conserver les données MySQL
volumes:
  mysql_data: